<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fitness 3D — Exercise Animation System Demo</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f0f1a; color: #eee; overflow: hidden; }
#canvas-container { width: 100vw; height: 100vh; }
canvas { display: block; }

#ui {
  position: fixed; top: 20px; left: 20px; z-index: 10;
  background: rgba(15,15,26,0.92); border-radius: 14px; padding: 22px;
  min-width: 300px; backdrop-filter: blur(12px);
  border: 1px solid rgba(74,144,226,0.3);
  box-shadow: 0 8px 32px rgba(0,0,0,0.4);
}
#ui h2 { font-size: 15px; margin-bottom: 14px; color: #4A90E2; font-weight: 600; }
#ui label { display: block; font-size: 11px; color: #888; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
#ui select, #ui input[type="range"] { width: 100%; margin-bottom: 12px; padding: 9px; border-radius: 7px; border: 1px solid #333; background: #1a1a2e; color: #eee; font-size: 13px; }
#ui button {
  width: 100%; padding: 11px; border: none; border-radius: 7px;
  background: linear-gradient(135deg, #4A90E2, #357abd); color: white; font-size: 13px; cursor: pointer;
  margin-bottom: 7px; transition: all 0.2s; font-weight: 500;
}
#ui button:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(74,144,226,0.3); }
#ui button.active { background: linear-gradient(135deg, #e74c3c, #c0392b); }
#ui .divider { height: 1px; background: #333; margin: 14px 0; }
#ui .stats { font-size: 11px; color: #666; margin-top: 8px; }
#ui .stats span { color: #4A90E2; }

#region-info {
  position: fixed; bottom: 20px; left: 20px; z-index: 10;
  background: rgba(15,15,26,0.92); border-radius: 14px; padding: 18px;
  min-width: 220px; backdrop-filter: blur(12px);
  border: 1px solid rgba(74,144,226,0.3);
  display: none;
}
#region-info h3 { font-size: 14px; color: #4A90E2; margin-bottom: 6px; }
#region-info p { font-size: 12px; color: #999; line-height: 1.6; }

#status {
  position: fixed; top: 20px; right: 20px; z-index: 10;
  background: rgba(15,15,26,0.92); border-radius: 14px; padding: 18px;
  font-size: 11px; color: #888; backdrop-filter: blur(12px);
  border: 1px solid rgba(74,144,226,0.3);
}
#status .stat { margin-bottom: 5px; }
#status .stat span { color: #4A90E2; font-weight: 600; }

#loading {
  position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
  font-size: 16px; color: #4A90E2; z-index: 100; text-align: center;
}
#loading .spinner {
  width: 40px; height: 40px; border: 3px solid #333; border-top-color: #4A90E2;
  border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 12px;
}
@keyframes spin { to { transform: rotate(360deg); } }

#exercise-list {
  position: fixed; top: 20px; right: 20px; z-index: 10;
  background: rgba(15,15,26,0.92); border-radius: 14px; padding: 18px;
  font-size: 11px; color: #888; backdrop-filter: blur(12px);
  border: 1px solid rgba(74,144,226,0.3);
  max-height: 80vh; overflow-y: auto; min-width: 180px;
}
#exercise-list h3 { font-size: 12px; color: #4A90E2; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.5px; }
#exercise-list .exercise-item {
  padding: 7px 10px; margin-bottom: 3px; border-radius: 5px; cursor: pointer;
  transition: all 0.15s; border: 1px solid transparent;
}
#exercise-list .exercise-item:hover { background: rgba(74,144,226,0.1); border-color: rgba(74,144,226,0.3); }
#exercise-list .exercise-item.active { background: rgba(74,144,226,0.2); border-color: #4A90E2; color: #fff; }
#exercise-list .exercise-item .source { font-size: 9px; color: #666; margin-top: 2px; }

<div id="loading">

<div id="region-info">

<div id="exercise-list">

// ============================================================
// BUILD ANIMATION CLIP from keyframes
// ============================================================
function buildClip(name, def) {
  const tracks = [];
  const jointNames = new Set();
  for (const [, rotations] of def.kf) {
    for (const j of Object.keys(rotations)) jointNames.add(j);
  }

  for (const jointName of jointNames) {
    const nodeName = JOINT_MAP[jointName];
    if (!nodeName) continue;
    const times = [], xVals = [], yVals = [], zVals = [];
    for (const [t, rotations] of def.kf) {
      times.push(t);
      const r = rotations[jointName] || [0,0,0];
      xVals.push(r[0] * Math.PI / 180);
      yVals.push(r[1] * Math.PI / 180);
      zVals.push(r[2] * Math.PI / 180);
    }
    tracks.push(new THREE.NumberKeyframeTrack(`${nodeName}.rotation[x]`, times, xVals));
    tracks.push(new THREE.NumberKeyframeTrack(`${nodeName}.rotation[y]`, times, yVals));
    tracks.push(new THREE.NumberKeyframeTrack(`${nodeName}.rotation[z]`, times, zVals));
  }
  return new THREE.AnimationClip(name, def.dur, tracks);
}

      currentAction.play();
    }

    document.getElementById('loading').style.display = 'none';
    document.getElementById('stat-status').textContent = 'Ready';
  },
  undefined,
  (err) => {
    console.error('Load error:', err);
    document.getElementById('loading').textContent = 'Error loading model';
  }
);

  const catDiv = document.createElement('div');

  for (const name of exercises) {

    div.className = 'exercise-item';
    div.textContent = name.replace(/_/g, ' ');
    div.onclick = () => {
      select.value = name;
      playExercise(name);
      document.querySelectorAll('.exercise-item').forEach(el => el.classList.remove('active'));
      div.classList.add('active');
    };
    exerciseItems.appendChild(div);
  }

function playExercise(name) {
  if (!modelRoot) return;
  const def = EXERCISE_ANIMS[name];
  if (!def) return;

  const clip = buildClip(name, def);
  mixer = new THREE.AnimationMixer(modelRoot);
  currentAction = mixer.clipAction(clip);
  currentAction.setLoop(isLooping ? THREE.LoopRepeat : THREE.LoopOnce, isLooping ? Infinity : 1);
  currentAction.clampWhenFinished = !isLooping;
  currentAction.timeScale = speed;
  currentAction.play();
  currentTime = 0;
  timeSlider.max = def.dur * 100;
  
  document.getElementById('stat-source').textContent = 'Procedural Keyframes';
}

select.addEventListener('change', (e) => playExercise(e.target.value));
playBtn.addEventListener('click', () => {
  isPlaying = !isPlaying;
  playBtn.textContent = isPlaying ? '▶ Play' : '⏸ Pause';
  playBtn.classList.toggle('active', !isPlaying);
  if (currentAction) {
    if (isPlaying) currentAction.play(); else currentAction.paused = true;
  }
});
loopBtn.addEventListener('click', () => {
  isLooping = !isLooping;
  loopBtn.textContent = `🔁 Loop: ${isLooping ? 'ON' : 'OFF'}`;
  if (currentAction) {
    currentAction.setLoop(isLooping ? THREE.LoopRepeat : THREE.LoopOnce, isLooping ? Infinity : 1);
  }
});
speedSlider.addEventListener('input', (e) => {
  speed = parseFloat(e.target.value);
  speedVal.textContent = speed.toFixed(1) + 'x';
  if (currentAction) currentAction.timeScale = speed;
});
timeSlider.addEventListener('input', (e) => {
  if (!currentAction) return;
  const t = parseFloat(e.target.value) / 100;
  currentAction.time = t;
  timeVal.textContent = t.toFixed(2) + 's';
});

  { id: 'right_shoulder', name: 'Right Shoulder', muscles: ['Deltoid (R)'], center: new THREE.Vector3(0.35, 1.05, 0), half: new THREE.Vector3(0.12, 0.12, 0.12) },
  { id: 'left_bicep', name: 'Left Bicep', muscles: ['Biceps Brachii (L)'], center: new THREE.Vector3(-0.4, 0.75, 0.05), half: new THREE.Vector3(0.08, 0.15, 0.08) },
  { id: 'right_bicep', name: 'Right Bicep', muscles: ['Biceps Brachii (R)'], center: new THREE.Vector3(0.4, 0.75, 0.05), half: new THREE.Vector3(0.08, 0.15, 0.08) },
  { id: 'left_tricep', name: 'Left Tricep', muscles: ['Triceps Brachii (L)'], center: new THREE.Vector3(-0.4, 0.75, -0.05), half: new THREE.Vector3(0.08, 0.15, 0.08) },

function classifyPoint(point) {
  for (const r of BODY_REGIONS) {
    if (Math.abs(point.x - r.center.x) <= r.half.x &&
        Math.abs(point.y - r.center.y) <= r.half.y &&
        Math.abs(point.z - r.center.z) <= r.half.z) {
      return r;
    }
  }
  let best = null, bestDist = Infinity;
  for (const r of BODY_REGIONS) {
    const d = point.distanceTo(r.center);
    if (d < bestDist) { bestDist = d; best = r; }
  }
  return bestDist < 0.5 ? best : null;
}

renderer.domElement.addEventListener('click', (e) => {
  if (!modelRoot) return;
  mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObject(modelRoot, true);
  if (hits.length > 0) {
    const region = classifyPoint(hits[0].point);
    if (region) {
      regionInfo.style.display = 'block';
      regionName.textContent = region.name;
      regionMuscles.textContent = region.muscles.join(', ');
    }
  }
});

// ============================================================
// ANIMATION LOOP
// ============================================================
const clock = new THREE.Clock();
let frameCount = 0, lastFpsTime = performance.now();

function animate() {
  requestAnimationFrame(animate);
  const delta = clock.getDelta();

  if (mixer && isPlaying) {
    mixer.update(delta * speed);
    if (currentAction) {
      currentTime = currentAction.time;
      timeVal.textContent = currentTime.toFixed(2) + 's';
      timeSlider.value = currentTime * 100;
    }
  }

  controls.update();
  renderer.render(scene, camera);

  frameCount++;
  const now = performance.now();
  if (now - lastFpsTime >= 1000) {
    document.getElementById('fps-count').textContent = frameCount;
    frameCount = 0;
    lastFpsTime = now;
  }
}

animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// Auto-play first exercise
setTimeout(() => {
  if (modelRoot) {
    playExercise('bench_press');
    document.getElementById('stat-status').textContent = 'Playing: Bench Press';
  }
}, 1000);
